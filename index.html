
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=0.25,maximum-scale=5,user-scalable=yes">
  <title>Alpha Token Volume Board</title>

  <!-- 手机端自动缩小视口，让页面显示更完整；同时尽早应用已保存的主题，避免首屏闪一下 --><script>
  (function(){
    if(/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)){
      var w=screen.width||window.innerWidth;
      if(w<800){
        document.querySelector('meta[name="viewport"]')
          .setAttribute('content','width=860,initial-scale='+(w/860).toFixed(3)+',minimum-scale=0.25,maximum-scale=5,user-scalable=yes');
      }
    }
    try{
      var theme=localStorage.getItem('theme');
      if(theme==='dark'||theme==='light') document.documentElement.classList.add(theme);
    }catch(e){}
  })();
  </script>

  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    :root{ --bg:#f9fafb;--text:#1f2937;--sub:#6b7280;--border:#e5e7eb; --green:#16a34a;--red:#dc2626;--primary:#2563eb }
    @media(prefers-color-scheme:dark){
      :root{--bg:#1e293b;--text:#f3f4f6;--sub:#9ca3af;--border:#334155}
    }
    :root.dark{--bg:#1e293b;--text:#f3f4f6;--sub:#9ca3af;--border:#334155}
    :root.light{--bg:#f9fafb;--text:#1f2937;--sub:#6b7280;--border:#e5e7eb}
    #themeBtn,#langBtn{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:4px;padding:4px 8px;cursor:pointer;font-size:.85rem}
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,"Segoe UI","PingFang SC",sans-serif;
      background:var(--bg);color:var(--text);line-height:1.5
    }
    h1{padding:18px 12px;text-align:center;font-size:1.35rem;color:var(--primary)}

    /* 最后更新时间 */
    .last-up{ text-align:center;font-size:.8rem;color:var(--sub);margin-top:-6px;margin-bottom:12px }

    /* ---------- 顶栏 ---------- */
    #bar{
      max-width:1200px;margin:0 auto 12px;
      display:flex;flex-direction:column;gap:8px;
      padding:0 6px
    }
    #bar-row1{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
    #bar-row1 input[type="search"]{flex:1;min-width:160px}
    #bar-row2{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
    #bar-row2 input[type="text"]{width:120px}
    #bar-row2 input[type="datetime-local"]{width:190px}
    #bar input{
      padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:.85rem
    }
    .btn{
      display:inline-flex;align-items:center;gap:4px;
      padding:6px 12px;font-size:.85rem;border:1px solid var(--primary);
      color:#fff;background:var(--primary);border-radius:4px;cursor:pointer
    }
    .btn[disabled]{background:#9ca3af;border-color:#9ca3af;cursor:not-allowed}
    .badge{ /* 仅用于进度百分比 */
      display:none;padding:0 6px;border-radius:10px;font-size:.7rem;font-weight:700;
      background:#fff;color:var(--primary)
    }
    #bar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto}
    #author{font-size:.8rem;white-space:nowrap}
    #author a{color:var(--primary);text-decoration:none}

    /* 新增：过滤开关 */
    .chk{
      display:inline-flex;align-items:center;gap:6px;
      font-size:.85rem;color:var(--text);user-select:none
    }

    /* ---------- 广告位 ---------- */
    .ad{
      max-width:1200px;margin:0 auto 10px;padding:8px 10px;
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;
      border:1px dashed var(--border);border-radius:6px;background:rgba(0,0,0,.02)
    }
    .ad-badge{
      font-size:.68rem;padding:0 6px;border-radius:8px;color:#fff;background:#6b7280
    }
    .ad-links{margin-left:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:relative;padding-bottom:18px}
    .ad .btn{padding:6px 10px}

    /* ✅ Telegram 徽章 */
    .tg-badge{
      display:inline-flex;align-items:center;gap:6px;
      font-size:.75rem;padding:2px 8px;border-radius:10px;
      color:#fff;background:#229ED9;text-decoration:none;line-height:1.6
    }
    .tg-badge:hover{opacity:.9}
    .tg-badge .icon{font-size:.9rem;line-height:1}

    /* ---------- 表格 ---------- */
    .table-wrap{max-width:1200px;margin:0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{ width:100%;border-collapse:collapse;min-width:620px }
    th,td{
      padding:10px 6px;border-bottom:1px solid var(--border);
      font-size:.85rem;text-align:left;white-space:nowrap
    }
    tbody tr:hover{background:rgba(0,0,0,.04);cursor:pointer}

    /* 窄屏下前两列（星标 + 序号）保持最小宽度（原 sticky 固定列方案已移除，只保留其列宽效果） */
    @media(max-width:760px){
      th:nth-child(1),td:nth-child(1){min-width:26px}
      th:nth-child(2),td:nth-child(2){min-width:28px}
    }

    th.sortable{cursor:pointer;user-select:none;position:relative}
    th.sortable::after{
      content:'▲';position:absolute;right:4px;font-size:.6rem;color:var(--sub);
      transform:scale(.8);opacity:0;transition:opacity .2s
    }
    th.sortable.desc::after{content:'▼';opacity:1}
    th.sortable.asc::after{content:'▲';opacity:1}

    /* Star */
    .star{cursor:pointer;font-size:1rem;color:var(--sub);user-select:none;transition:transform .15s,color .15s}
    .star.fav{color:#f7b500}.star.bounce{transform:scale(1.4)}

    /* 颜色 & 小字 */
    .logo{width:18px;height:18px;margin-right:4px;vertical-align:middle;border-radius:50%}
    .up{color:var(--green)}.down{color:var(--red)}
    .subl{display:block;font-size:.72rem;color:var(--sub)}
    .qv-fail{color:var(--red);cursor:help}

    /* ✅ 30天内上新标记 */
    .tag-new{
      display:inline-block;margin-left:6px;padding:0 6px;border-radius:10px;
      font-size:.68rem;line-height:1.4;border:1px solid var(--primary);
      color:var(--primary);background:rgba(37,99,235,.08)
    }

    /* ✅ 合约标记 */
    .tag-futures{
      display:inline-block;margin-left:4px;padding:0 5px;border-radius:10px;
      font-size:.68rem;line-height:1.4;border:1px solid #f59e0b;
      color:#f59e0b;background:rgba(245,158,11,.08);font-weight:700
    }

    /* ✅ 交易量加成活动倒计时标记（🔥 剩X天）——配色同"30天内上新" */
    .tag-mul{
      display:inline-block;margin-left:4px;padding:0 5px;border-radius:10px;
      font-size:.68rem;line-height:1.4;border:1px solid var(--primary);
      color:var(--primary);background:rgba(37,99,235,.08);cursor:help
    }

    /* ✅ 交易赛总交易量：主数字加深加粗 + 点击复制 */
    .comp-vol-main{
      display:inline-block;font-weight:800;color:#111827;font-size:.92rem;
      cursor:copy;padding:0 2px;border-radius:3px;transition:background .15s
    }
    .comp-vol-main:hover{background:rgba(37,99,235,.12)}
    :root.dark .comp-vol-main{color:#f9fafb}
    @media(prefers-color-scheme:dark){
      :root:not(.light) .comp-vol-main{color:#f9fafb}
    }

    /* ✅ 交易赛标记 */
    .tag-comp{
      display:inline-block;margin-left:4px;padding:0 5px;border-radius:10px;
      font-size:.68rem;line-height:1.4;font-weight:700;cursor:help
    }
    .tag-comp.comp-active{
      border:1px solid #16a34a;color:#16a34a;background:rgba(22,163,74,.08)
    }
    .tag-comp.comp-ended{
      border:1px solid #9ca3af;color:#9ca3af;background:rgba(156,163,175,.08)
    }
    .tag-comp.comp-upcoming{
      border:1px solid #2563eb;color:#2563eb;background:rgba(37,99,235,.08)
    }

    /* ✅ 交易赛返佣链接（手续费减免） */
    .referral-link{
      display:block;margin-top:2px;font-size:.72rem;font-weight:600;
      color:#ef4444;text-decoration:none;line-height:1.4
    }
    .referral-link:hover{text-decoration:underline}

    /* Toast */
    #toast{
      position:fixed;bottom:40px;left:50%;transform:translateX(-50%);
      background:rgba(0,0,0,.8);color:#fff;padding:8px 16px;border-radius:6px;
      font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .3s
    }

    /* 自定义区间结果 */
    #customVol{max-width:1200px;margin:4px auto 0;font-size:.9rem;color:var(--primary)}

    /* ---------- 小时交易量 ---------- */
    #hourlyWrap{max-width:1200px;margin:10px auto 0;padding:0 6px}
    .hourly-header{
      display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;
      padding:8px 12px;background:linear-gradient(135deg,rgba(37,99,235,.08),rgba(37,99,235,.02));
      border-radius:8px;border:1px solid rgba(37,99,235,.15)
    }
    .hourly-header .hourly-title{font-size:.9rem;color:var(--primary);font-weight:700}
    .hourly-header .hourly-total{
      font-size:.82rem;color:var(--text);font-weight:600;
      background:rgba(37,99,235,.1);padding:2px 10px;border-radius:12px
    }
    .hourly-header .hourly-actions{
      display:inline-flex;align-items:center;gap:6px;margin-left:4px
    }
    .hourly-header .hourly-min{
      background:transparent;border:1px solid var(--border);color:var(--text);
      border-radius:4px;padding:2px 10px;font-size:.76rem;cursor:pointer;
      line-height:1.3;user-select:none
    }
    .hourly-header .hourly-min:hover{background:rgba(37,99,235,.1);border-color:var(--primary);color:var(--primary)}
    #hourlyWrap.collapsed .hourly-scroll{display:none}
    #hourlyWrap.collapsed .hourly-header{border-radius:8px}
    .hourly-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;
      background:repeating-linear-gradient(0deg,transparent,transparent 24px,var(--border) 24px,var(--border) 25px);
      border-radius:0 0 8px 8px;padding:8px 4px 0;border:1px solid var(--border);border-top:none
    }
    #hourlyWrap .hourly-bar{display:flex;align-items:flex-end;gap:4px;margin-top:0;min-width:max-content;padding-bottom:2px}
    #hourlyWrap .hourly-bar .h-col{
      display:flex;flex-direction:column;align-items:center;gap:2px;min-width:72px;flex:1;
      transition:transform .15s;cursor:default
    }
    #hourlyWrap .hourly-bar .h-col:hover{transform:scaleY(1.03) translateY(-1px)}
    #hourlyWrap .hourly-bar .h-col .h-bar{
      width:calc(100% - 8px);min-height:4px;border-radius:4px 4px 1px 1px;
      background:linear-gradient(180deg,#3b82f6,#2563eb);
      box-shadow:0 1px 3px rgba(37,99,235,.2);
      transition:height .4s cubic-bezier(.4,0,.2,1),opacity .3s
    }
    #hourlyWrap .hourly-bar .h-col:hover .h-bar{
      background:linear-gradient(180deg,#60a5fa,#3b82f6);
      box-shadow:0 2px 8px rgba(37,99,235,.35)
    }
    #hourlyWrap .hourly-bar .h-col .h-val{font-size:.68rem;color:var(--sub);font-weight:600;white-space:nowrap}
    #hourlyWrap .hourly-bar .h-col:hover .h-val{color:var(--primary)}
    #hourlyWrap .hourly-bar .h-col .h-lbl{font-size:.66rem;color:var(--sub);padding-bottom:2px;white-space:nowrap}
    #hourlyWrap .hourly-bar .h-col.h-max .h-bar{background:linear-gradient(180deg,#22c55e,#16a34a);box-shadow:0 1px 3px rgba(22,163,74,.25)}
    #hourlyWrap .hourly-bar .h-col.h-max .h-val{color:var(--green);font-weight:700}
    #hourlyWrap .hourly-bar .h-col.h-min .h-bar{background:linear-gradient(180deg,#f87171,#dc2626);box-shadow:0 1px 3px rgba(220,38,38,.25)}
    #hourlyWrap .hourly-bar .h-col.h-min .h-val{color:var(--red);font-weight:700}
    @keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    #hourlyWrap .hourly-bar .h-col .h-bar{transform-origin:bottom;animation:barGrow .5s cubic-bezier(.4,0,.2,1) both}

    /* ---------- 查询缓存记录 ---------- */
    #cacheWrap{max-width:1200px;margin:6px auto 0;padding:0 6px}
    .cache-hd{display:flex;align-items:center;gap:8px}
    #cacheToggle{font-size:.82rem;color:var(--primary);cursor:pointer;user-select:none;background:none;border:none}
    #cacheToggle:hover{text-decoration:underline}
    #cacheClearAll{font-size:.76rem;color:var(--red);cursor:pointer;background:none;border:1px solid var(--red);border-radius:4px;padding:1px 8px;display:none}
    #cacheClearAll:hover{background:rgba(220,38,38,.08)}
    #cacheList{margin-top:4px;display:none;border:1px solid var(--border);border-radius:6px;overflow:hidden;max-height:260px;overflow-y:auto}
    #cacheList .cache-item{
      display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:.82rem;
      border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s
    }
    #cacheList .cache-item:last-child{border-bottom:none}
    #cacheList .cache-item:hover{background:rgba(37,99,235,.06)}
    #cacheList .cache-item .ci-info{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #cacheList .cache-item .ci-del{
      color:var(--red);cursor:pointer;font-size:.78rem;padding:2px 6px;border-radius:4px;
      border:1px solid transparent;flex-shrink:0
    }
    #cacheList .cache-item .ci-del:hover{border-color:var(--red);background:rgba(220,38,38,.06)}
    #cacheList .cache-empty{padding:10px;text-align:center;font-size:.8rem;color:var(--sub)}

    footer{height:16px;margin-bottom:12px}

    /* ---------- 回到顶部按钮 ---------- */
    #backTop{
      position:fixed;bottom:32px;right:20px;width:40px;height:40px;
      border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--text);
      font-size:1.1rem;cursor:pointer;display:none;align-items:center;justify-content:center;
      box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:99;transition:opacity .3s
    }
    #backTop:hover{background:var(--primary);color:#fff;border-color:var(--primary)}

    /* =========================================================
       ✅ 仅优化广告位 ad-links 里的注册链接按钮 + 引导提示（不影响顶部按钮）
       ========================================================= */
    /* 覆盖广告区按钮尺寸与圆角 */
    .ad-links .btn{
      padding:9px 14px;
      border-radius:12px;
      font-weight:800;
      line-height:1.2;
      text-decoration:none;
      transition:transform .15s, box-shadow .15s, background .2s, color .2s, border-color .2s;
      white-space:nowrap;
    }
    .ad-links .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }

    /* ✅ 币安 & OKX 按钮：透明描边 + 推荐角标（合并重复样式） */
    .ad-links .btn-main,
    .ad-links .btn-ghost{
      background:transparent !important;
      border-color:var(--primary) !important;
      color:var(--primary) !important;
      position:relative;
    }
    .ad-links .btn-main:hover,
    .ad-links .btn-ghost:hover{
      background:rgba(37,99,235,.10) !important;
    }
    .ad-links .btn-main::after,
    .ad-links .btn-ghost::after{
      content:attr(data-badge);
      position:absolute;
      top:-8px; right:-8px;
      font-size:.68rem;
      padding:2px 6px;
      border-radius:999px;
      background:#f59e0b;
      color:#fff;
      box-shadow:0 8px 18px rgba(0,0,0,.16);
    }

    /* ✅ 引导标志：点击注册提醒（桌面端显示在按钮下方） */
    @keyframes hintNudge{
      0%,100%{ transform:translateX(-50%) translateY(0); }
      50%{ transform:translateX(-50%) translateY(-2px); }
    }
    .ad-links::after{
      content:attr(data-hint);
      position:absolute;
      left:50%;
      bottom:0;
      transform:translateX(-50%);
      font-size:.72rem;
      color:var(--sub);
      white-space:nowrap;
      pointer-events:none;
      opacity:.9;
      animation:hintNudge 1.4s ease-in-out 6;
    }

    /* ✅ 数字右对齐：可自定义列 */
    .ra-wrap{position:relative;display:inline-flex;align-items:center;gap:4px}
    .ra-wrap .btn-mini{
      background:transparent;border:1px solid var(--border);color:var(--sub);
      border-radius:4px;padding:1px 6px;cursor:pointer;font-size:.78rem;line-height:1.4
    }
    .ra-wrap .btn-mini:hover{color:var(--primary);border-color:var(--primary)}
    .ra-panel{
      display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:20;
      background:var(--bg);border:1px solid var(--border);border-radius:6px;
      padding:8px 10px;box-shadow:0 4px 12px rgba(0,0,0,.15);
      min-width:200px;font-size:.82rem
    }
    .ra-panel.show{display:block}
    .ra-panel .ra-title{
      display:flex;align-items:center;justify-content:space-between;gap:8px;
      font-weight:700;margin-bottom:6px;font-size:.78rem;color:var(--sub)
    }
    .ra-panel .ra-title .ra-actions{display:inline-flex;gap:6px}
    .ra-panel .ra-title button{
      background:transparent;border:1px solid var(--border);color:var(--sub);
      border-radius:4px;padding:1px 6px;cursor:pointer;font-size:.72rem;line-height:1.3
    }
    .ra-panel .ra-title button:hover{color:var(--primary);border-color:var(--primary)}
    .ra-panel label{display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer;color:var(--text);user-select:none}
    .ra-panel label input{margin:0}

    /* ========== 手机端 / 窄屏全局优化（手机视口已被 JS 拉宽到 860px；三处同条件媒体查询已合并） ========== */
    @media(max-width:860px){
      h1{font-size:1.1rem;padding:10px 8px 6px}
      .last-up{font-size:.72rem;margin-bottom:6px}
      #bar{gap:5px;padding:0 6px;margin-bottom:8px}
      #bar-row1{gap:5px}
      #bar-row1 input[type="search"]{min-width:120px;font-size:.8rem;padding:5px 6px}
      .btn{padding:5px 10px;font-size:.8rem}
      .chk{font-size:.78rem;gap:3px}
      #bar-right{gap:5px}
      #author{font-size:.74rem}
      #bar-row2{gap:5px}
      #bar-row2 input[type="text"]{width:90px;font-size:.8rem;padding:5px 6px}
      #bar-row2 input[type="datetime-local"]{flex:1;min-width:140px;font-size:.75rem;padding:4px 5px}
      #bar-row2 input[type="number"]{font-size:.8rem;padding:4px}
      /* 广告区紧凑；引导提示改为正常占位，避免绝对定位挤压布局 */
      .ad{padding:6px 8px;gap:6px;margin-bottom:6px}
      .ad-badge{font-size:.64rem}
      .tg-badge{font-size:.7rem;padding:1px 6px}
      .ad-links{width:100%;justify-content:flex-start;margin-left:0;gap:8px;padding-bottom:0}
      .ad-links .btn{padding:6px 10px;font-size:.74rem;border-radius:8px}
      .ad-links::after{position:static;display:block;transform:none;animation:none;margin-top:6px;text-align:left}
      /* 表格 —— 不再需要水平滚动 */
      table{min-width:auto;width:100%}
      th,td{padding:8px 4px;font-size:.78rem}
      .tag-new,.tag-futures,.tag-comp,.tag-mul{font-size:.62rem;padding:0 4px;margin-left:2px}
      .logo{width:16px;height:16px;margin-right:2px}
      .subl{font-size:.66rem}
      /* 小时图紧凑 */
      #hourlyWrap{margin-top:6px}
      .hourly-header{padding:6px 8px}
      .hourly-header .hourly-title{font-size:.8rem}
      .hourly-header .hourly-total{font-size:.74rem}
      /* 缓存区紧凑 */
      #cacheWrap{margin-top:4px}
      #cacheToggle{font-size:.76rem}
      #cacheList .cache-item{padding:4px 8px;font-size:.76rem}
    }
  </style>
</head>
<body>
  <h1 id="title" data-i18n="title">Binance&nbsp;Alpha&nbsp;&mdash;&nbsp;24H&nbsp;交易量排行榜</h1>
  <p id="lastUp" class="last-up"></p>

  <div id="bar">
    <div id="bar-row1">
      <input id="search" type="search" data-i18n-ph="searchPh" placeholder="🔍 按代币名称 / 符号过滤…">
      <button id="refreshBtn" class="btn"> ⟳ <span data-i18n="refresh">刷新数据</span> <span id="progress" class="badge">0%</span> </button>
      <label class="chk"><input id="onlyNew" type="checkbox"> <span data-i18n="onlyNew">仅看30天内上新</span></label>
      <label class="chk"><input id="onlyFutures" type="checkbox"> <span data-i18n="onlyFutures">仅看有合约</span></label>
      <label class="chk"><input id="onlySec" type="checkbox"> <span data-i18n="onlySec">仅看代币化证券</span></label>
      <label class="chk"><input id="hideSec" type="checkbox"> <span data-i18n="hideSec">不显示代币化证券</span></label>

    /* 智能价格格式化：小于 0.01 的价格自动显示更多有效位 */
    function fmtPrice(p){
      if(!p||p<=0) return '-';
      if(p>=1) return nf2.format(p);
      let digits=4;
      if(p<0.01){ const m=p.toFixed(20).match(/^0\.(0+)/); digits=(m?m[1].length:0)+3; }
      return cachedFmt('price:'+digits,()=>new Intl.NumberFormat('en-US',{minimumFractionDigits:digits,maximumFractionDigits:digits})).format(p);
    }

      if(!n||n<=0) return '-';
      if(n>=1e9) return '$'+(n/1e9).toFixed(2)+'B';
      if(n>=1e6) return '$'+(n/1e6).toFixed(2)+'M';
      if(n>=1e3) return '$'+(n/1e3).toFixed(2)+'K';
      return '$'+nf0.format(n);

    let toastTimer=null;

    /* 两个带日期区间的表头：用最近一次刷新的区间渲染（切换语言时也用它，不再改成当前时间） */

    /* ✅ 复制到剪贴板（带 execCommand 回退） */
    function copyText(text){
      const done = ok => showToast(ok ? `${t('copied')}：${text}` : t('copyFail'));
      if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(text).then(()=>done(true)).catch(()=>done(false));
        return;
      }
      try{
        const ta=document.createElement('textarea');
        ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        const ok=document.execCommand('copy');
        document.body.removeChild(ta);
        done(ok);
      }catch{ done(false); }
    }

    let rows=[],filter='',sortKey='todayQV',sortDir='desc',showNewOnly=false,showFuturesOnly=false,showSecOnly=false,hideSecOnly=false,showCompOnly=false;
    let lastRange=null;       // 最近一次刷新的区间 {today8,yest8,endTs}
    let lastUpdateTs=0;       // 最近一次成功刷新的时间戳
    let lastRangeResult=null; // 最近一次区间查询结果（切换语言时重绘）
    let lastHourlyData=null;  // 最近一次小时查询结果（切换语言时重绘）

    /* HTML 转义：接口返回的 symbol / iconUrl 和用户输入都经过它再拼进 innerHTML */
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    /* datetime-local 输入框的值（本地时间） */
    const pad2=n=>String(n).padStart(2,'0');
    const toLocalInput=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

    function pLimit(n){
      const q=[];let run=0;
      const next=()=>{if(run>=n||!q.length)return;run++;q.shift()().finally(()=>{run--;next();});};
      // ✅ 同步抛错和 reject 都传给调用方，不再让 Promise.all 永远挂起
      return fn=>new Promise((res,rej)=>{q.push(()=>Promise.resolve().then(fn).then(res,rej));next();});
    }
    const limit=pLimit(CONCURRENCY);

    // ------------------------------
    // ✅ Aster 24h 行情（用于 Aster 合约交易赛合成行）
    // ------------------------------
    async function asterTicker24h(base, sym){
      try{
        const url=`${base}/fapi/v3/ticker/24hr?symbol=${encodeURIComponent(sym)}`;
        const json=await fetchWithTimeout(url).then(r=>r.json());
        return {
          price:parseFloat(json?.lastPrice||0),
          vol24h:parseFloat(json?.quoteVolume||0),
          chg:parseFloat(json?.priceChangePercent||0)
        };
      }catch{
        return { price:0, vol24h:0, chg:0 };
      }
    }

    // ------------------------------
    // ✅ K 线拉取统一入口：返回 {ok, data}。ok=false 表示请求失败（网络 / 接口报错），区别于"成功但没有数据"
    //    之前 qvOk / qvAuto / qvKlinesAuto 三处各写一遍成功判断和 USDT→USDC 回退，这里合并成一份
    // ------------------------------
    const klineUrl=(endpoint, sym, start, end, interval)=>
      `${endpoint}?symbol=${encodeURIComponent(sym)}&interval=${interval}&startTime=${start}&endTime=${end}&limit=1500`;
    const parseAlpha=json=>{
      const ok=(json?.success!==false) && (json?.code==null || ['000000','0'].includes(String(json.code)));
      return ok ? json?.data : null;
    };
    const parseAster=json=>json;
    async function fetchKlines(url, parse){
      try{
        const data=parse(await fetchWithTimeout(url).then(r=>r.json()));
        return Array.isArray(data) ? {ok:true, data} : {ok:false, data:[]};
      }catch(e){
        return {ok:false, data:[], timeout:e?.name==='AbortError'};
      }
    }
    /* 汇总成交额 / 笔数（K 线第 8 列 quoteVolume，第 9 列 trades） */
    function sumKlines(data){
      let vol=0,trades=0;
      for(const k of data){ vol+=parseFloat(k?.[7]||0); trades+=parseInt(k?.[8]||0); }
      return {vol,trades};
    }

    /* ✅ 根据区间长度自动选最细的 K 线粒度，保证单次请求内 K 线数 ≤ 1500（避免被截断）。
       短区间用 1m（支持半小时这种亚小时查询），长区间自动放粗。 */
    function pickKlineInterval(start, end){
      const mins=(end-start)/60000;
      const opts=[['1m',1],['5m',5],['15m',15],['30m',30],['1h',60],['2h',120],['4h',240],['6h',360],['12h',720],['1d',1440]];
      for(const [name,m] of opts){ if(mins/m<=1450) return name; }
      return '1d';
    }

    /* 按代币行拉 K 线：Aster 合成行走 Aster；其它优先 USDT，接口报错时回退 USDC 并缓存可用交易对
       （请求超时不回退：USDC 大概率同样超时，免得再白等一次） */
    async function klinesAuto(row, start, end, interval='1h'){
      if(start>=end) return {ok:true, data:[]};
      if(row.useAsterApi){
        return fetchKlines(klineUrl(`${row.asterBase||ASTER_BASE}/fapi/v3/klines`, row.asterSymbol||row.sym, start, end, interval), parseAster);
      }
      const primary=row.qSym||row.sym; // row.sym 默认是 `${alphaId}USDT`
      let res=await fetchKlines(klineUrl(K_API, primary, start, end, interval), parseAlpha);
      if(res.ok||res.timeout) return res;
      const alt=row.symUSDC||(row.sym&&row.sym.endsWith('USDT') ? row.sym.replace(/USDT$/,'USDC') : '');
      if(!alt||alt===primary) return res;
      res=await fetchKlines(klineUrl(K_API, alt, start, end, interval), parseAlpha);
      if(res.ok) row.qSym=alt; // 缓存实际可用交易对
      return res;
    }
    /* 区间成交额：{ok, vol, trades}；ok=false 时调用方显示"失败"而不是 0 */
    async function qvAuto(row, start, end, interval='1h'){
      const res=await klinesAuto(row, start, end, interval);
      return {ok:res.ok, ...sumKlines(res.data)};
    }

    /* 公共：按名称/交易对查找代币行 */
    function findRow(sym){
      const lc = sym.toLowerCase();
      let row=rows.find(r=>
        r.symbol.toLowerCase()===lc ||
        (r.sym && r.sym.toLowerCase()===lc) ||
        (r.symUSDC && r.symUSDC.toLowerCase()===lc) ||
        (r.qSym && r.qSym.toLowerCase()===lc)
      );
      if(!row){
        const m=sym.match(/_(\d+)/);
        if(m) row={sym:`${m[1]}USDT`,symUSDC:`${m[1]}USDC`,qSym:null,symbol:sym};
      }
      return row||null;
    }

    /* 渲染节流：填充过程中最多每 800ms 重绘一次表格 */
    let renderTimer=null;
    function scheduleRender(delay=800){
      if(renderTimer) return;
      renderTimer=setTimeout(()=>{ renderTimer=null; render(); }, delay);
    }
    function cancelScheduledRender(){ clearTimeout(renderTimer); renderTimer=null; }

    async function fillQVAll(list,today8,yest8,endTs){
      let done=0,total=list.length;
      if(!total) return;
      progressEl.style.display='inline-block';
      await Promise.all(list.map(r=>limit(async()=>{
        // ✅ Aster 合成行额外刷新 24h 行情（用于填充 price/vol24h/chg）
        const tickerPromise = r.useAsterApi
          ? asterTicker24h(r.asterBase||ASTER_BASE, r.asterSymbol||r.sym)
          : Promise.resolve(null);
        // ✅ "前一天 + 当天"一次拉完（昨天 08:00 ~ 现在，≤48 根 1h K 线），本地按 openTime 切分，请求数减半
        const [dayRes,tickerRes]=await Promise.all([
          klinesAuto(r,yest8,endTs,'1h'),
          tickerPromise
        ]);
        if(tickerRes){
          if(tickerRes.price) r.price=tickerRes.price;
          if(tickerRes.vol24h) r.vol24h=tickerRes.vol24h;
          if(!isNaN(tickerRes.chg)) r.chg=tickerRes.chg;
        }
        if(dayRes.ok){
          const prev=[],today=[];
          for(const k of dayRes.data) (+k[0]<today8 ? prev : today).push(k);
          r.prevQV=sumKlines(prev).vol; r.todayQV=sumKlines(today).vol; r.qvFail=false;
        }else{
          r.qvFail=true; // ✅ 请求失败：保留旧值（首次加载为 null）并标记，不再显示成 0
        }
        // ✅ 交易赛累计成交额：合成行通过 useAsterApi 自动走 Aster，其它走 Binance Alpha
        if(r.comp){
          const now=Date.now();
          const cStart=r.comp.start, cEnd=r.comp.end;
          if(now>cStart){
            // ✅ 自适应粒度：交易赛开始时间可能不是整点（如 SLX 12:30），
            //    用 1h 会因首根整点 K 线 openTime 早于开始时间而被漏掉导致显示 0。
            const cEndTs=Math.min(now, cEnd);
            const compRes=await qvAuto(r, cStart, cEndTs, pickKlineInterval(cStart, cEndTs));
            if(compRes.ok){ r.compVol=compRes.vol; r.compTrades=compRes.trades; r.compFail=false; }
            else r.compFail=true;
          } else {
            r.compVol=0; r.compTrades=0; r.compFail=false;
          }
        }
        progressEl.textContent=`${Math.floor(++done/total*100)}%`;
        scheduleRender();
      })));
      progressEl.style.display='none';
    }

    const favs=()=>{try{return JSON.parse(storeGet(FAV_KEY)||'[]');}catch{return [];}};
    function toggleFav(sym){
      const f=favs();const i=f.indexOf(sym);
      i>-1?f.splice(i,1):f.push(sym);
      storeSet(FAV_KEY,JSON.stringify(f));
      showToast(i>-1 ? t('favDel') : t('favAdd'));
      render();
    }

    async function fetchList(){
      ensureFutures();   // ✅ 合约列表并行拉取、不阻塞主列表；到达后由 applyFutures 补标记
      const resp=await fetchWithTimeout(LIST_API);
      if(!resp.ok)throw new Error('LIST_API Error');
      const {data=[]}=await resp.json();

      const rawList = data
        .filter(tk => {
          // ✅ 过滤：仅当 listingCex=true 且已 cexOffDisplay=true 才视为现货下架；单独 listingCex=true 不能用来过滤
          if (tk.listingCex === true && tk.cexOffDisplay === true) return false;
          if (tk.offline === true) return false;
          return +tk.volume24h > 0 || (tk.stockState === true && tk.rwaInfo != null);
        })
        .map(tk=>{
          const raw = Number(tk.listingTime || 0);
          const ltMs = raw ? (raw < 1e12 ? raw*1000 : raw) : 0;
          const isTokenizedSecurity = tk.stockState === true && tk.rwaInfo != null;
          // ✅ 代币化证券不计入"30天内上新"
          const isNew = !isTokenizedSecurity && ltMs ? (Date.now() - ltMs) < NEW_WINDOW_MS : false;

          // ✅ FDV：优先使用 API 返回字段，否则用 price × totalSupply
          const priceN = +tk.price || 0;
          const totalSupplyN = +tk.totalSupply || +tk.circulatingSupply || 0;

          // ✅ 交易量加成活动截止时间（按合约地址查 MUL_END，未登记则为 0）
          const mulEnd = MUL_END[(tk.contractAddress || '').toLowerCase()] || 0;
          const fdv =
            +tk.fdv ||
            +tk.fullyDilutedMarketCap ||
            +tk.fullyDilutedValuation ||
            +tk.marketCap ||
            (priceN && totalSupplyN ? priceN * totalSupplyN : 0);

          return {
            price:priceN,
            vol24h:+tk.volume24h||0,
            chg:+tk.percentChange24h||0,
            symbol:tk.symbol,
            icon:tk.iconUrl,

            // ✅ 唯一标识（同 ticker 撞名时用它区分不同代币）
            alphaId:tk.alphaId,

            // ✅ 默认仍用 USDT 作为"身份 key"（收藏等不受影响）
            sym:`${tk.alphaId}USDT`,
            // ✅ USDC 备选交易对
            symUSDC:`${tk.alphaId}USDC`,
            // ✅ 缓存：实际能用的交易对（USDT/USDC）
            qSym:null,

            // ✅ null 表示"还在加载"；0 才是真正的 0；qvFail=true 表示本轮请求失败
            todayQV:null,
            prevQV:null,
            qvFail:false,

            listingTime: ltMs,
            isNew,

            // ✅ FDV
            fdv,

            // 代币化证券：按上面的答案，用 stockState + rwaInfo 判断
            isTokenizedSecurity,

            // ✅ 是否上了币安合约
            hasFutures: futuresSet.has(tk.symbol.toUpperCase()),

            // ✅ 交易量加成活动截止时间
            mulEnd,

            // ✅ 交易赛
            comp: COMP_MAP[tk.symbol.toUpperCase()] || null,
            compVol: null,
            compTrades: null,
            compFail: false
          };
        });

      // ✅ 同 ticker 撞名去重：当多个代币共用同一个交易赛 symbol 时（例如两个都叫 SLX），
      //    只保留 24h 交易量最高（其次 FDV 最高）的"真实"代币，撞名的山寨小币自动隐藏。
      //    去重后，24H 交易量列、区间查询、交易赛累计成交额都会自动指向这个真实代币。
      //    非交易赛代币不受影响，全部保留。
      const compSyms = new Set(COMPETITIONS.map(c=>c.symbol.toUpperCase()));
      const best = new Map(); // symbol(大写) -> 当前最优行
      const isBetter = (a,b)=>{               // a 是否比 b 更优？
        const va=a.vol24h||0, vb=b.vol24h||0;
        if(va!==vb) return va>vb;             // 24h 交易量优先（保留交易量第一的那个）
        return (a.fdv||0)>(b.fdv||0);         // 交易量相同则比 FDV
      };
      for(const r of rawList){
        const key=r.symbol.toUpperCase();
        if(!compSyms.has(key)) continue;      // 只对交易赛 ticker 去重
        const cur=best.get(key);
        if(!cur || isBetter(r,cur)) best.set(key,r);
      }
      const list = rawList.filter(r=>{
        const key=r.symbol.toUpperCase();
        if(!compSyms.has(key)) return true;   // 非交易赛代币：原样保留
        return best.get(key)===r;             // 交易赛代币：只保留最优那个
      });

      // ✅ 注入合成代币条目（Aster 合约交易赛，数据全部来自 Aster；Logo/FDV 复用基础代币）
      const existingSyms = new Set(list.map(r=>r.symbol.toUpperCase()));
      for(const comp of COMPETITIONS){
        const key=comp.symbol.toUpperCase();
        if(comp.syntheticToken && !existingSyms.has(key)){
          const baseRow = comp.baseSymbol
            ? list.find(r=>r.symbol.toUpperCase()===comp.baseSymbol.toUpperCase())
            : null;
          list.push({
            price:0,
            vol24h:0,
            chg:0,
            symbol:comp.symbol,
            icon: comp.icon || (baseRow ? baseRow.icon : ''),
            alphaId:comp.symbol,
            synthetic:true,
            sym:comp.symbol,
            symUSDC:'',
            qSym:null,
            todayQV:null,
            prevQV:null,
            qvFail:false,
            listingTime:0,
            isNew:false,
            fdv: baseRow ? baseRow.fdv : 0,
            isTokenizedSecurity:false,
            hasFutures:!!comp.isFutures,
            mulEnd:0,
            comp,
            compVol:null,
            compTrades:null,
            compFail:false,
            useAsterApi:comp.api==='aster',
            asterBase:comp.asterBase||ASTER_BASE,
            asterSymbol:comp.asterSymbol||`${comp.symbol}USDT`
          });
        }
      }

      return list;
    }

    function sortRows(arr){
      // null 值统一放到末尾（无论升序/降序）；compVol 列对无 comp 的行视为 null
      const val = o => {
        const v = o[sortKey];
        if(sortKey==='compVol' && !o.comp) return null;
        return v==null ? null : v;
      };
      return [...arr].sort((a,b)=>{
        const va=val(a), vb=val(b);
        if(va==null && vb==null) return 0;
        if(va==null) return 1;
        if(vb==null) return -1;
        return sortDir==='desc' ? vb-va : va-vb;
      });
    }
    /* 复选框筛选条件（render 与刷新时"只刷新可见币种"共用同一份逻辑） */
    function passesFilters(r){
      return (!showNewOnly || r.isNew) &&
             (!showFuturesOnly || r.hasFutures) &&
             (!showSecOnly || r.isTokenizedSecurity) &&
             (!hideSecOnly || !r.isTokenizedSecurity) &&
             (!showCompOnly || !!r.comp);
    }
    function updateSortIcons(){
      document.querySelectorAll('th.sortable').forEach(th=>{
        th.classList.remove('asc','desc');
        if(th.dataset.key===sortKey)th.classList.add(sortDir);
      });
    }

    function render(){
      const favSet=new Set(favs());
      const priceBySym = {};
      rows.forEach(r=>{ if(r.symbol) priceBySym[r.symbol.toUpperCase()] = r.price; });
      const f = filter;
      const filtered=rows.filter(r=>{
        const matched = !f ||
          r.symbol.toLowerCase().includes(f) ||
          (r.sym||'').toLowerCase().includes(f) ||
          (r.symUSDC||'').toLowerCase().includes(f) ||
          (r.qSym||'').toLowerCase().includes(f);
        return matched && passesFilters(r);
      });

      const sorted=sortRows(filtered);
      const display=[...sorted.filter(x=>favSet.has(x.sym)),...sorted.filter(x=>!favSet.has(x.sym))];

      // ✅ null = 还在加载（…）；请求失败显示 —（有旧值时显示旧值 + ⚠），不再把失败显示成 0
      const failMark=`<span class="qv-fail" title="${esc(t('qvFail'))}">—</span>`;
      const warnMark=` <span class="qv-fail" title="${esc(t('qvFail'))}">⚠</span>`;
      const fmtQV=(v,fail)=> v==null ? (fail?failMark:'…') : nf0.format(v)+(fail?warnMark:'');
      const tipPrefix = t('listingTip');
      const copyTip = esc(t('copyTip'));

      tbody.innerHTML=display.map((r,i)=>{
        const left = r.isNew && r.listingTime ? daysLeft(r.listingTime) : 0;
        const listingTip = r.listingTime ? esc(tipPrefix+fmtFull(r.listingTime)) : '';

        // ✅ 交易赛标记
        let compTag='';
        if(r.comp){
          const now=Date.now(), c=r.comp;
          const compTip=esc(t('compTip')(c.topN, c.pool, c.perWinner, fmtFull(c.start), fmtFull(c.end)));
          if(now<c.start){
            compTag=`<span class="tag-comp comp-upcoming" title="${compTip}">${t('compUpcoming')}</span>`;
          } else if(now<=c.end){
            const remain=c.end-now;
            const unit=remain<3600000?'m':remain<86400000?'h':'d';
            const val=unit==='m'?Math.max(1,Math.ceil(remain/60000)):unit==='h'?Math.max(1,Math.ceil(remain/3600000)):Math.ceil(remain/86400000);
            compTag=`<span class="tag-comp comp-active" title="${compTip}">${t('compActive')(val,unit)}</span>`;
          } else {
            compTag=`<span class="tag-comp comp-ended" title="${compTip}">${t('compEnded')}</span>`;
          }
        }

        // ✅ 交易量加成活动倒计时标记（原理同"30天内上新"：剩X天，到期自动消失；仅对 MUL_END 登记的代币显示，不显示倍数）
        let mulTag='';
        if(r.mulEnd && Date.now() <= r.mulEnd){
          const d = Math.max(0, Math.ceil((r.mulEnd - Date.now()) / 86400000));
          mulTag = `<span class="tag-mul" title="${esc(t('mulTip')(fmtFull(r.mulEnd)))}">${t('mulTag')(d)}</span>`;
        }

        // ✅ 交易赛交易量列
        let compCell='-';
        if(r.comp){
          if(r.compVol==null) compCell = r.compFail ? failMark : '…';
          else {
            const rewardAmt=parseFloat(r.comp.perWinner.replace(/,/g,''))||0;
            // ✅ 奖励币种：优先 rewardSymbol，其次从 perWinner 文本解析（如 '50 USDC' → USDC），
            //    都没有才回退到本代币价格。否则 USDC 等稳定币奖励会被误按本币价格换算
            const perWinnerSym = (r.comp.perWinner.match(/[A-Za-z][A-Za-z0-9]*\s*$/)||[''])[0].trim().toUpperCase();
            const rewardSym = (r.comp.rewardSymbol||perWinnerSym).toUpperCase();
            const isOwnToken = !rewardSym || rewardSym===r.symbol.toUpperCase();
            // ✅ 稳定币奖励（如 USDC）不在 Alpha 价格表里，按 $1 计
            const rewardPrice = ['USDC','USDT','FDUSD','DAI','USD1'].includes(rewardSym)
              ? 1
              : (isOwnToken ? r.price : (priceBySym[rewardSym]||0));
            const rewardUsd=rewardAmt*rewardPrice;
            compCell=`<span class="comp-vol-main" data-vol="${Math.round(r.compVol)}" title="${copyTip}">${nf0.format(r.compVol)}</span>${r.compFail?warnMark:''}<span class="subl">${fmtShort(r.comp.start)}~${fmtShort(Math.min(Date.now(),r.comp.end))}</span>`
              +`<span class="subl">🎁 ${esc(r.comp.perWinner)} ≈ $${nf2.format(rewardUsd)}</span>`;
          }
        }

        const iconHtml = r.icon
          ? `<img class="logo" loading="lazy" src="${esc(r.icon)}" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='https://bin.bnbstatic.com/static/images/common/base-token-default.png'">`
          : '';
        const referral = r.comp && r.comp.referralUrl
          ? `<a class="referral-link" href="${esc(r.comp.referralUrl)}" target="_blank" rel="noopener noreferrer">${r.comp.referralKey ? t(r.comp.referralKey) : t('referralDefault')}</a>`
          : '';

        return `
        <tr data-sym="${esc(r.sym)}">
          <td class="star ${favSet.has(r.sym)?'fav':''}">${favSet.has(r.sym)?'★':'☆'}</td>
          <td>${i+1}</td>
          <td title="${listingTip}">
            ${iconHtml}
            ${esc(r.symbol)}
            ${r.hasFutures ? `<span class="tag-futures">${t('futuresTag')}</span>` : ''}
            ${r.isNew ? `<span class="tag-new" title="${listingTip}">${t('newTag')(left)}</span>` : ''}
            ${mulTag}
            ${compTag}
            ${referral}
          </td>
          <td data-col="price">${fmtPrice(r.price)}</td>
          <td data-col="vol24h">${nf0.format(r.vol24h)}</td>
          <td data-col="chg"><span class="${r.chg>=0?'up':'down'}">${r.chg.toFixed(2)}%</span></td>
          <td data-col="fdv">${fmtFdv(r.fdv)}</td>
          <td data-col="todayQV">${fmtQV(r.todayQV, r.qvFail)}</td>
          <td data-col="prevQV">${fmtQV(r.prevQV, r.qvFail)}</td>
          ${showCompOnly?`<td data-col="compVol">${compCell}</td>`:''}
        </tr>
      `;
      }).join('');
      updateSortIcons();
    }

    let reloading=false;
    async function reloadAll(){
      if(reloading) return;   // ✅ 防重入：定时器 / 页面可见 / 手动点击不会叠加两轮请求
      reloading=true;
      refreshBtn.disabled=true;progressEl.textContent='0%';
      const isFirstLoad=rows.length===0;
      if(isFirstLoad) tbody.innerHTML=`<tr><td colspan="9" style="text-align:center;padding:24px">${t('loading')}</td></tr>`;
      const today8=nearest8UTC(),yest8=today8-864e5,endTs=Date.now();
      const boundaryChanged=!!lastRange&&lastRange.today8!==today8;
      lastRange={today8,yest8,endTs};
      renderHeaders();

      try{
        const newRows=await fetchList();
        // ✅ 先沿用旧数据再逐步覆盖（按 sym 即 alphaId 匹配，同名代币不会串数据）；跨过日界线后"当天 / 前一天"的旧值作废
        if(rows.length){
          const oldMap=new Map(rows.map(r=>[r.sym,r]));
          for(const r of newRows){
            const o=oldMap.get(r.sym);
            if(!o) continue;
            r.qSym=o.qSym;
            if(!boundaryChanged){ r.todayQV=o.todayQV; r.prevQV=o.prevQV; }
            if(o.compVol!=null){ r.compVol=o.compVol; r.compTrades=o.compTrades; }
            // 合成代币条目（Aster 数据）没有现成行情，复用旧值
            if(r.useAsterApi){
              if(o.price) r.price=o.price;
              if(o.vol24h) r.vol24h=o.vol24h;
              if(o.chg!=null) r.chg=o.chg;
            }
          }
        }
        rows=newRows;
        applyFutures();
        render();   // ✅ 列表先显示，成交额用 … 占位，随后逐步填充（不再等全部请求完成才出表格）
        // 有筛选时只刷新符合条件的币种，其余沿用旧数据（首次加载仍全量拉取）
        const hasFilter=showCompOnly||showNewOnly||showFuturesOnly||showSecOnly||hideSecOnly;
        const toRefresh=(hasFilter&&!isFirstLoad) ? newRows.filter(passesFilters) : newRows;
        await fillQVAll(toRefresh,today8,yest8,endTs);
        lastUpdateTs=Date.now();
        renderLastUp();
      }catch(e){
        console.error(e);
        const msg=e.message||t('unknownErr');
        if(isFirstLoad) tbody.innerHTML=`<tr><td colspan="9">${t('failLoad')}${esc(msg)}</td></tr>`;
        showToast(`${t('failLoad')}${msg}`);
      }finally{
        cancelScheduledRender();
        if(rows.length) render();
        refreshBtn.disabled=false;
        reloading=false;
      }
    }

    (function initDateInputs(){
      startEl.value=toLocalInput(new Date(nearest8UTC()));
      endEl.value =toLocalInput(new Date());
    })();

    rangeBtn.addEventListener('click',async()=>{
      const sym=tokenEl.value.trim();
      if(!sym){showToast(t('enterSym'));return;}
      const row=findRow(sym);
      if(!row){showToast(t('notFound'));return;}

      const st=new Date(startEl.value).getTime(),et=new Date(endEl.value).getTime();
      if(!st||!et||st>=et){showToast(t('badRange'));return;}

      rangeBtn.disabled=true;progressEl.textContent=t('querying');progressEl.style.display='inline-block';
      let res;
      try{ res=await qvAuto(row,st,et-1,pickKlineInterval(st,et)); }
      finally{ rangeBtn.disabled=false;progressEl.style.display='none'; }
      if(!res.ok){ showToast(t('qvFail')); return; }   // ✅ 请求失败不显示 0，也不写入记录

      const displayLabel = row.symbol||sym;
      showRangeResult({symbol:displayLabel, start:st, end:et, vol:res.vol, trades:res.trades});
      // 保存到缓存
      saveCache({symbol:displayLabel, start:st, end:et, vol:res.vol, trades:res.trades, time:Date.now()});
    });

    /* ---------- 近N小时每小时交易量 ---------- */
    hourlyBtn.addEventListener('click',async()=>{
      const sym=tokenEl.value.trim();
      if(!sym){showToast(t('enterSym'));return;}
      const row=findRow(sym);
      if(!row){showToast(t('notFound'));return;}

      const hours=Math.max(1,Math.min(72,parseInt(hourlyHoursEl.value)||6));
      const now=Date.now();
      const endH=new Date(now);endH.setMinutes(0,0,0);
      const endTs=endH.getTime();
      const startTs=endTs-hours*3600000;
      const hasPartial=now-endTs>60000; // 超过1分钟才显示当前不完整小时

      hourlyBtn.disabled=true;progressEl.textContent=t('querying');progressEl.style.display='inline-block';
      let res;
      try{ res=await klinesAuto(row, startTs, hasPartial ? now : (endTs-1), '1h'); }   // ✅ 一次拉取整段区间的 K 线
      finally{ hourlyBtn.disabled=false;progressEl.style.display='none'; }
      if(!res.ok){ showToast(t('qvFail')); return; }

      // ✅ 按 openTime 一次遍历落到对应小时桶（最后一个桶是当前不完整小时）
      const hourlyData=[];
      for(let i=0;i<hours;i++) hourlyData.push({start:startTs+i*3600000,end:startTs+(i+1)*3600000-1,vol:0,trades:0});
      if(hasPartial) hourlyData.push({start:endTs,end:now,vol:0,trades:0,partial:true});
      for(const k of res.data){
        const b=hourlyData[Math.floor((+k[0]-startTs)/3600000)];
        if(!b) continue;
        b.vol+=parseFloat(k?.[7]||0); b.trades+=parseInt(k?.[8]||0);
      }

      const totalVol=hourlyData.reduce((s,d)=>s+d.vol,0);
      const totalTrades=hourlyData.reduce((s,d)=>s+d.trades,0);
      const displayLabel = row.symbol||sym;
      lastHourlyData={symbol:displayLabel, hours, data:hourlyData};
      renderHourly(lastHourlyData);

      // 保存小时查询到缓存
      saveCache({symbol:displayLabel, start:startTs, end:endTs, vol:totalVol, trades:totalTrades, time:Date.now(), type:'hourly', hours});
    });

    /* ---------- 小时图渲染（可复用） ---------- */
    function renderHourly(info){
      const {symbol, hours, data:hourlyData}=info;
      const maxVol=Math.max(...hourlyData.map(d=>d.vol),1);
      const minVol=Math.min(...hourlyData.map(d=>d.vol));
      const totalVol=hourlyData.reduce((s,d)=>s+d.vol,0);
      const totalTrades=hourlyData.reduce((s,d)=>s+d.trades,0);
      const totalAvg=totalTrades>0?Math.round(totalVol/totalTrades):0;
      const maxBarH=120;
      const fmtHour=(ts,partial)=>{
        const d=new Date(ts);
        if(partial){const hh=String(d.getHours()).padStart(2,'0');const mm=String(d.getMinutes()).padStart(2,'0');return `${hh}:${mm}`;}
        const hh=String(d.getHours()).padStart(2,'0');
        return `${hh}:00`;
      };
      const fmtHourEnd=(ts)=>{
        const d=new Date(ts+1);
        const hh=String(d.getHours()).padStart(2,'0');
        return `${hh}:00`;
      };
      const collapsed = hourlyWrap.classList.contains('collapsed');
      const minLabel = collapsed ? t('hourlyExpand') : t('hourlyMinimize');
      const minIcon = collapsed ? '▼' : '▲';
      hourlyWrap.innerHTML=`<div class="hourly-header"><span class="hourly-title">${t('hourlyTpl')(esc(symbol),hours)}</span><span class="hourly-total">${t('hourlyTotal')(nf0.format(totalVol))}<br><small style="font-weight:normal;color:var(--sub)">${t('tradeStats')(nf0.format(totalTrades), nf0.format(totalAvg))}</small></span><span class="hourly-actions"><button type="button" class="hourly-min" id="hourlyMinBtn" title="${minLabel}">${minIcon} ${minLabel}</button></span></div>
        <div class="hourly-scroll"><div class="hourly-bar">${hourlyData.map((d,i)=>{
          const h=Math.max(4,Math.round(d.vol/maxVol*maxBarH));
          const cls=hours>1&&d.vol===maxVol?'h-col h-max':hours>1&&d.vol===minVol?'h-col h-min':'h-col';
          const avg=d.trades>0?Math.round(d.vol/d.trades):0;
          return `<div class="${cls}">
            <div class="h-val">${nf0.format(d.vol)}<br><small style="color:var(--sub);font-size:11px">${t('avgPerTrade')(nf0.format(avg))}</small></div>
            <div class="h-bar" style="height:${h}px;animation-delay:${i*30}ms"></div>
            <div class="h-lbl">${fmtHour(d.start,false)}-${d.partial?fmtHour(d.end,true):fmtHourEnd(d.end)}${d.partial?'*':''}</div>
          </div>`;
        }).join('')}</div></div>`;
    }

    /* ---------- 区间查询缓存记录 ---------- */
    let cacheOpen=false;
    function getCache(){try{return JSON.parse(storeGet(CACHE_KEY)||'[]');}catch{return [];}}
    function setCache(arr){storeSet(CACHE_KEY,JSON.stringify(arr));renderCache();}
    function saveCache(entry){
      const cache=getCache();
      cache.unshift(entry);
      if(cache.length>50)cache.length=50;
      setCache(cache);
    }
    function deleteCache(idx){
      const cache=getCache();cache.splice(idx,1);setCache(cache);
    }
    function clearAllCache(){
      storeRemove(CACHE_KEY);cacheOpen=false;renderCache();
    }
    /* 区间查询结果展示（查询 / 加载记录 / 切换语言共用） */
    function showRangeResult(item){
      lastRangeResult=item;
      const trades=+item.trades||0;
      customVolEl.innerHTML=t('rangeTpl')(esc(item.symbol), fmtFull(item.start), fmtFull(item.end), nf0.format(item.vol))
        + (trades>0 ? `<br>${t('tradeStats')(nf0.format(trades), nf0.format(Math.round(item.vol/trades)))}` : '');
    }
    function loadCache(idx){
      const item=getCache()[idx];
      if(!item)return;
      showRangeResult(item);
      // 回填输入框，方便微调再查
      tokenEl.value=item.symbol;
      startEl.value=toLocalInput(new Date(item.start));
      endEl.value=toLocalInput(new Date(item.end));
    }
    /* ✅ 记录区按钮的文字 / 显隐统一在这里维护（之前首次查询后按钮没有文字、宽度为 0） */
    function renderCache(){
      const cache=getCache();
      const hasData=cache.length>0;
      if(!hasData) cacheOpen=false;
      cacheToggleBtn.style.display=hasData?'inline-block':'none';
      cacheToggleBtn.textContent=cacheOpen?t('cacheHide'):t('cacheTitle');
      cacheClearAllBtn.style.display=(hasData&&cacheOpen)?'inline-block':'none';
      cacheClearAllBtn.textContent=t('cacheClearAll');
      cacheListEl.style.display=cacheOpen?'block':'none';
      if(!cacheOpen)return;
      cacheListEl.innerHTML=cache.map((c,i)=>{
        const typeBadge=c.type==='hourly'?`<span style="font-size:.68rem;padding:0 4px;border-radius:4px;background:rgba(37,99,235,.1);color:var(--primary);margin-right:4px">${+c.hours||6}h</span>`:'';
        const timeStr=c.time?`<span style="color:var(--sub);font-size:.72rem;margin-left:6px">${t('cacheTime')} ${fmtFull(c.time)}</span>`:'';
        return `<div class="cache-item">
          <span class="ci-info" data-idx="${i}">${typeBadge}<strong>${esc(c.symbol)}</strong>&nbsp; ${fmtFull(c.start)} ~ ${fmtFull(c.end)}&nbsp; → ${nf0.format(c.vol)}${timeStr}</span>
          <span class="ci-del" data-delidx="${i}">${t('cacheDel')}</span>
        </div>`;
      }).join('');
    }
    cacheToggleBtn.addEventListener('click',()=>{ cacheOpen=!cacheOpen; renderCache(); });
    cacheClearAllBtn.addEventListener('click',clearAllCache);
    cacheListEl.addEventListener('click',e=>{
      const delBtn=e.target.closest('[data-delidx]');
      if(delBtn){e.stopPropagation();deleteCache(+delBtn.dataset.delidx);return;}
      const item=e.target.closest('[data-idx]');
      if(item)loadCache(+item.dataset.idx);
    });

    let searchTimer=null;
    document.getElementById('search').addEventListener('input',e=>{
      clearTimeout(searchTimer);   // ✅ 输入节流：连续敲键只重绘一次
      searchTimer=setTimeout(()=>{ filter=e.target.value.trim().toLowerCase(); render(); },120);
    });

    tbody.addEventListener('click',e=>{
      const s=e.target.closest('.star');
      if(s){
        const trSym=s.closest('tr').dataset.sym;
        s.classList.add('bounce');setTimeout(()=>s.classList.remove('bounce'),150);toggleFav(trSym);return;
      }
      // ✅ 点击交易赛总交易量 → 复制原始数字
      const cv=e.target.closest('.comp-vol-main');
      if(cv&&cv.dataset.vol){
        e.stopPropagation();
        copyText(cv.dataset.vol);
        return;
      }
      // ✅ 点击返佣链接 → 仅跳转，不触发整行点击（避免回填代币名）
      if(e.target.closest('.referral-link')){
        e.stopPropagation();
        return;
      }
      // 点击表格行自动填充代币名到输入框
      const tr=e.target.closest('tr');
      if(tr&&tr.dataset.sym){
        const row=rows.find(r=>r.sym===tr.dataset.sym);
        if(row){
          tokenEl.value=row.symbol;
          showToast(row.symbol);
        }
      }
    });

    /* ✅ 小时图：缩小/展开 */
    hourlyWrap.addEventListener('click',e=>{
      const btn=e.target.closest('#hourlyMinBtn');
      if(!btn) return;
      const collapsed = hourlyWrap.classList.toggle('collapsed');
      const label = collapsed ? t('hourlyExpand') : t('hourlyMinimize');
      const icon = collapsed ? '▼' : '▲';
      btn.textContent = `${icon} ${label}`;
      btn.title = label;
    });

document.querySelectorAll('th.sortable').forEach(th=>{
      th.addEventListener('click',()=>{
        const key=th.dataset.key;
        sortDir=(sortKey===key&&sortDir==='desc')?'asc':'desc';sortKey=key;render();
      });
    });

    onlyNewEl.addEventListener('change', (e)=>{
      showNewOnly = e.target.checked;
      render();
    });

    onlyFuturesEl.addEventListener('change', (e)=>{
      showFuturesOnly = e.target.checked;
      render();
    });

    onlySecEl.addEventListener('change', (e)=>{
      showSecOnly = e.target.checked;
      if(showSecOnly && hideSecEl.checked){
        hideSecEl.checked = false;
        hideSecOnly = false;
      }
      render();
    });

    hideSecEl.addEventListener('change', (e)=>{
      hideSecOnly = e.target.checked;
      if(hideSecOnly && onlySecEl.checked){
        onlySecEl.checked = false;
        showSecOnly = false;
      }
      render();
    });

    onlyCompEl.addEventListener('change', (e)=>{
      showCompOnly = e.target.checked;
      thCompVol.style.display = showCompOnly ? '' : 'none';
      render();
    });

    /* ---------- 数字右对齐（可自定义列） ---------- */
    const RA_NUM_COLS = ['price','vol24h','chg','fdv','todayQV','prevQV','compVol'];
    const RA_KEY = 'alphaRightAlign';
    const RA_COLS_KEY = 'alphaRightAlignCols';
    const rightAlignEl = document.getElementById('rightAlign');
    const raCustomBtn = document.getElementById('raCustomBtn');
    const raPanel = document.getElementById('raPanel');
    const raAllBtn = document.getElementById('raAllBtn');
    const raNoneBtn = document.getElementById('raNoneBtn');
    let raEnabled = storeGet(RA_KEY)==='1';
    let raCols = (()=>{
      try{
        const v = JSON.parse(storeGet(RA_COLS_KEY)||'null');
        if(Array.isArray(v)) return new Set(v.filter(c=>RA_NUM_COLS.includes(c)));
      }catch{}
      return new Set(RA_NUM_COLS);
    })();
    const raStyleEl = document.createElement('style');
    raStyleEl.id = 'raDynamicStyle';
    document.head.appendChild(raStyleEl);

    function applyRA(){
      if(!raEnabled || raCols.size===0){ raStyleEl.textContent=''; return; }
      const sels = [...raCols].map(c=>
        `#tokenTable th[data-col="${c}"], #tokenTable td[data-col="${c}"]`
      ).join(',');
      raStyleEl.textContent = `${sels}{text-align:right}`;
    }
    function saveRA(){
      storeSet(RA_KEY, raEnabled?'1':'0');
      storeSet(RA_COLS_KEY, JSON.stringify([...raCols]));
    }
    function syncRAUI(){
      rightAlignEl.checked = raEnabled;
      raPanel.querySelectorAll('input[type="checkbox"][data-col]').forEach(cb=>{
        cb.checked = raCols.has(cb.dataset.col);
      });
    }

    syncRAUI();
    applyRA();

    rightAlignEl.addEventListener('change', e=>{
      raEnabled = e.target.checked;
      saveRA();
      applyRA();
    });
    raCustomBtn.addEventListener('click', e=>{
      e.stopPropagation();
      raPanel.classList.toggle('show');
    });
    raPanel.addEventListener('click', e=>{ e.stopPropagation(); });
    document.addEventListener('click', ()=>{ raPanel.classList.remove('show'); });
    raPanel.querySelectorAll('input[type="checkbox"][data-col]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        if(cb.checked) raCols.add(cb.dataset.col);
        else raCols.delete(cb.dataset.col);
        saveRA();
        applyRA();
      });
    });
    raAllBtn.addEventListener('click', ()=>{
      raCols = new Set(RA_NUM_COLS);
      syncRAUI();
      saveRA();
      applyRA();
    });
    raNoneBtn.addEventListener('click', ()=>{
      raCols.clear();
      syncRAUI();
      saveRA();
      applyRA();
    });

    refreshBtn.addEventListener('click', ()=>reloadAll());

    // 页面重新可见且已跨过日界线 → 立即刷新；其余每 5 分钟刷新一次（reloadAll 自带防重入）
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='visible'&&lastRange&&lastRange.today8!==nearest8UTC())reloadAll();
    });
    setInterval(()=>{if(document.visibilityState==='visible')reloadAll();},300000);

    /* ---------- 深色模式切换（已保存的主题在 <head> 的内联脚本里提前应用，避免首屏闪烁） ---------- */
    document.getElementById('themeBtn').addEventListener('click',()=>{
      const root=document.documentElement;
      const isDark=root.classList.contains('dark')||(
        !root.classList.contains('light')&&matchMedia('(prefers-color-scheme:dark)').matches
      );
      root.classList.remove('dark','light');
      root.classList.add(isDark?'light':'dark');
      storeSet('theme',isDark?'light':'dark');
    });

    /* ---------- 语言切换 ---------- */
    document.getElementById('langBtn').addEventListener('click',()=>{
      curLang = curLang==='zh' ? 'en' : 'zh';
      storeSet('lang', curLang);
      applyI18n();                 // 含两个带区间的表头（用上次刷新的区间）
      renderLastUp();              // ✅ 用保存的刷新时间重新格式化，不再被改成当前时间
      renderCache();
      if(lastRangeResult) showRangeResult(lastRangeResult);
      if(lastHourlyData) renderHourly(lastHourlyData);
      render();
    });

    /* ---------- 回到顶部 ---------- */
    const backTopBtn=document.getElementById('backTop');
    window.addEventListener('scroll',()=>{
      backTopBtn.style.display=window.scrollY>300?'flex':'none';
    },{passive:true});
    backTopBtn.addEventListener('click',()=>{
      window.scrollTo({top:0,behavior:'smooth'});
    });

    /* ---------- 初始化 ---------- */
    applyI18n();
    renderCache();
    reloadAll();   // 合约列表在 fetchList 内与主列表并行拉取
  </script>
</body>
</html>
